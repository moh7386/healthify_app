name: Build Android APK

# سيعمل هذا الأكشن تلقائياً عند الدفع (Push) لفرع main، أو عند تشغيله يدوياً
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # تجهيز بيئة الجافا (مطلوبة لبناء تطبيقات الأندرويد)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # تجهيز محرك Flutter الذي تعتمد عليه Flet
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.28.3
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # أمر البناء السحري من Flet
      - name: Build APK with Flet
        run: |
          flet build apk

      # رفع ملف الـ APK النهائي لتتمكن من تحميله
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: healthify-app-release
          path: build/apk/
